<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sinh viên 5 Tốt 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Navbar cố định cao 73px -->
  <header class="navbar" aria-label="Điều hướng chính"></header>

  <!-- Hero banner -->
  <section class="hero-banner">
    <div class="page-grid">
      <div class="page-grid__content hero-banner__layout">

        <!-- Cột trái: nội dung chữ -->
        <div class="hero-content">
          <h1 class="hero-content__title">
            <span class="hero-content__title-line--one">SINH VIÊN</span>
            <span class="hero-content__title-line--two">5 TỐT 2026</span>
          </h1>
          <p class="hero-content__subtitle">Cổng thông tin Sinh viên 5 Tốt</p>

          <div class="hero-content__actions">
            <a href="#dang-ky" class="button button--primary">Đăng ký phong trào SV5T</a>
            <a href="#nien-bieu" class="button button--outline">Xem niên biểu hoạt động</a>
          </div>
        </div>

        <!-- Cột phải: 3 khung ảnh -->
        <div class="hero-gallery">
          <div class="hero-gallery__item hero-gallery__item--one">Ảnh 1</div>
          <div class="hero-gallery__item hero-gallery__item--two">Ảnh 2</div>
          <div class="hero-gallery__item hero-gallery__item--three">Ảnh 3</div>
        </div>

      </div>
    </div>
  </section>
</body>
</html>
