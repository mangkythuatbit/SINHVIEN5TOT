   <!DOCTYPE html>
   <html lang="vi">
    <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/root.css" />
</head>

<body class="font-['Be_Vietnam_Pro',sans-serif]">
 <!-- ================= SECTION: PHONG TRÀO SV5T QUA TỪNG NĂM ================= -->
<section class="bg-white">
  <div class="mx-auto max-w-[1200px] px-6 py-10">


    <!-- Dòng 1: Tiêu đề + nút chọn năm -->
    <div class="mb-6 flex items-center justify-between">
      <h2 class="text-2xl font-bold text-[#0f2a4a]">Phong trào SV5T qua từng năm</h2>

      <div id="year-tabs" class="flex items-center gap-3" role="tablist">
        <button type="button" role="tab" data-year="2024" data-active="false"
          class="year-btn rounded-lg border-2 border-[#0f2a4a] bg-white px-5 py-1.5 font-bold text-[#0f2a4a] transition
                 data-[active=true]:bg-[#0f2a4a] data-[active=true]:text-white">2024</button>
        <button type="button" role="tab" data-year="2025" data-active="false"
          class="year-btn rounded-lg border-2 border-[#0f2a4a] bg-white px-5 py-1.5 font-bold text-[#0f2a4a] transition
                 data-[active=true]:bg-[#0f2a4a] data-[active=true]:text-white">2025</button>
        <button type="button" role="tab" data-year="2026" data-active="true"
          class="year-btn rounded-lg border-2 border-[#0f2a4a] bg-white px-5 py-1.5 font-bold text-[#0f2a4a] transition
                 data-[active=true]:bg-[#0f2a4a] data-[active=true]:text-white">2026</button>
      </div>
    </div>

    <!-- Dòng 2: Card thông tin -->
    <div class="rounded-2xl border border-blue-100 p-8">
      <div class="grid grid-cols-1 items-center gap-8 md:grid-cols-12">

        <!-- Cột 1 -->
        <div class="md:col-span-4">
          <div id="year-count" class="text-6xl font-black text-[#0f2a4a]">4</div>
          <p id="year-count-label" class="mt-2 text-sm font-medium text-gray-500">chặng hoạt động · đang diễn ra</p>
        </div>

        <!-- Cột 2 -->
        <div class="md:col-span-8">
          <h3 id="year-title" class="mb-2 text-xl font-bold text-[#0f2a4a]">Phong trào Sinh viên 5 Tốt 2026</h3>
          <p id="year-desc" class="text-sm leading-relaxed text-gray-600">
            Hành trình 2026 đang diễn ra sôi nổi với 4 chặng hoạt động dự kiến. Năm nay tiếp tục đẩy mạnh ứng dụng công nghệ trong việc theo dõi và hỗ trợ sinh viên hoàn thiện hồ sơ.
          </p>
        </div>

      </div>
    </div>
  </div>
</section>

<script>
  const YEAR_DATA = {
    // TODO: thay số liệu và mô tả thật cho 2024, 2025
    "2024": { count: "0", label: "chặng hoạt động · đã kết thúc", title: "Phong trào Sinh viên 5 Tốt 2024", desc: "Nội dung đang cập nhật." },
    "2025": { count: "0", label: "chặng hoạt động · đã kết thúc", title: "Phong trào Sinh viên 5 Tốt 2025", desc: "Nội dung đang cập nhật." },
    "2026": {
      count: "4",
      label: "chặng hoạt động · đang diễn ra",
      title: "Phong trào Sinh viên 5 Tốt 2026",
      desc: "Hành trình 2026 đang diễn ra sôi nổi với 4 chặng hoạt động dự kiến. Năm nay tiếp tục đẩy mạnh ứng dụng công nghệ trong việc theo dõi và hỗ trợ sinh viên hoàn thiện hồ sơ."
    }
  };

  const yearBtns = document.querySelectorAll("#year-tabs .year-btn");
  yearBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      yearBtns.forEach(b => b.dataset.active = "false");
      btn.dataset.active = "true";

      const d = YEAR_DATA[btn.dataset.year];
      document.getElementById("year-count").textContent = d.count;
      document.getElementById("year-count-label").textContent = d.label;
      document.getElementById("year-title").textContent = d.title;
      document.getElementById("year-desc").textContent = d.desc;
    });
  });
</script>
   </body>
   </html>
